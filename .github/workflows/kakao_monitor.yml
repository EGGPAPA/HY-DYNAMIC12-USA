name: HY DYNAMIC12 Kakao Monitor

on:
  schedule:
  - cron: '30-59/15 13 * * 1-5'
  - cron: '*/15 14-19 * * 1-5'
  - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hy-dynamic12-kakao-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check requests yfinance pandas

      - name: Check prices and send Kakao alerts
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          APP_URL: https://eggpapa-hy-dynamic12-usa-app-s7ppvp.streamlit.app
        run: python kakao_monitor.py

      - name: Save alert state
        run: |
          if git status --porcelain data/kakao_monitor_state.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/kakao_monitor_state.json
            git commit -m "Update Kakao monitor alert state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No alert state changes"
          fi
